# Use AFTER Let's Encrypt certs exist for microtechnique.in (certbot or certbot certificates).
# Replaces a broken split where :80 redirects to :443 but :443 does not proxy to Docker.
#
#   sudo cp deploy/nginx-microtechnique.https-full.example.conf /etc/nginx/sites-available/microtechnique.in
#   sudo nginx -t && sudo systemctl restart nginx
#
# Requires: Docker frontend on host port 8080 (FRONTEND_PORT=8080).

server {
    listen 80;
    listen [::]:80;
    server_name microtechnique.in www.microtechnique.in;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name microtechnique.in www.microtechnique.in;

    ssl_certificate     /etc/letsencrypt/live/microtechnique.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/microtechnique.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    # Optional if present: ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 50M;
    }
}
