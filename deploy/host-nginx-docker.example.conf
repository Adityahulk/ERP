# Host nginx → Docker frontend on 127.0.0.1:8080 (set FRONTEND_PORT=8080 in .env next to docker-compose.yml).
#
# Install:
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/host-nginx-docker.example.conf /etc/nginx/sites-available/microtechnique.in
#   sudo ln -sf /etc/nginx/sites-available/microtechnique.in /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl restart nginx
#
# First TLS (keeps http:// working until you confirm https:// — avoids “http→https→error”):
#   sudo certbot --nginx -d microtechnique.in -d www.microtechnique.in --no-redirect --agree-tos -m YOUR@EMAIL -n
# After https:// works in a browser, add redirect:
#   sudo certbot install --cert-name microtechnique.in --redirect
# Or merge nginx-microtechnique.https-full.example.conf and test with: sudo nginx -t
#
# DNS: apex A → droplet; www → A same IP or CNAME to apex.

server {
    listen 80;
    listen [::]:80;
    server_name microtechnique.in www.microtechnique.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }
}
