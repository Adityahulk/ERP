services:
  postgres:
    image: postgres:15-alpine
    container_name: bizflow_postgres
    environment:
      POSTGRES_DB: bizflow
      POSTGRES_USER: bizflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bizflow_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bizflow_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bizflow_backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Keep container-internal port stable for nginx upstream (frontend/nginx.conf -> backend:5000)
      PORT: 5000
      # Force docker-internal service discovery to avoid localhost/127.0.0.1 mistakes in .env
      DATABASE_URL: postgresql://bizflow:${POSTGRES_PASSWORD:-bizflow_dev}@postgres:5432/bizflow
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bizflow_frontend
    # Host port 80 → http://<server-ip>/ with no :port (avoid host nginx on 80 or use FRONTEND_PORT=8080 + reverse proxy).
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
