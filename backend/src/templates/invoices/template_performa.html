<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; position: relative; }
    .wm { position: fixed; top: 30%; left: 10%; font-size: 48px; color: rgba(79,70,229,0.12); transform: rotate(-35deg); font-weight: 800; pointer-events: none; z-index: 0; }
    .content { position: relative; z-index: 1; }
    h1 { color: {{PRIMARY_COLOR}}; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
    th, td { border: 1px solid #e5e7eb; padding: 6px; }
    th { background: {{PRIMARY_COLOR}}; color: #fff; }
    .right { text-align: right; }
  </style>
</head>
<body>
  <div class="wm">PROFORMA INVOICE</div>
  <div class="content">
    <h1>Proforma Invoice</h1>
    <p>{{COMPANY_NAME}} — {{INVOICE_NUMBER}} — {{INVOICE_DATE}}</p>
    <p>Buyer: {{BUYER_NAME}}</p>
    <table>
      <thead><tr><th>#</th><th>Item</th><th>HSN</th><th class="right">Qty</th><th class="right">Rate</th><th class="right">Total</th></tr></thead>
      <tbody>{{ITEM_ROWS}}</tbody>
    </table>
    <p style="margin-top:12px;font-weight:bold">Total: ₹{{GRAND_TOTAL}}</p>
  </div>
</body>
</html>
