# Included from http { } — map is valid here.
map $http_x_forwarded_proto $microtechnique_forwarded_proto {
    ~^https?$ $http_x_forwarded_proto;
    default    $scheme;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        send_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $microtechnique_forwarded_proto;
        client_max_body_size 50M;
    }

    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $microtechnique_forwarded_proto;
        client_max_body_size 50M;
    }

    # Vite code-split chunks live here. Do NOT fall back to index.html for missing files —
    # that returns HTML as "JS" and breaks dynamic imports after a deploy or stale tab.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Application screens contain customer and accounting data and must never be indexed.
    location ~ ^/(login|superadmin|items|barcode|inventory|parties|dashboard|sales-hub|sales|quotations|billing|proforma-invoices|purchase-expense|purchases|expenses|reports|accounting|cash-bank|gst-filing|attendance|profile|hr|job-work|settings|onboarding|trial|register|pos-scan)(/|$) {
        root /usr/share/nginx/html;
        try_files $uri $uri.html $uri/ /index.html;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain application/javascript application/json text/css;
}
